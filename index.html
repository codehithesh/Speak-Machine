<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151612">
<title>Topic Machine</title>
<style>
:root{
  --bg:#151612;--panel:#1d1f1a;--panel2:#252820;--line:#3a3d32;
  --text:#f4f1e8;--muted:#9e9b8d;--accent:#6f8f61;--accent2:#9e754d;
  --danger:#e62323;--shadow:0 18px 50px rgba(0,0,0,.35);
  --slot-bg:#10110e;--slot-border:#383b2f;--slot-window-border:#2c2f25;
  --slot-window-bg:rgba(255,255,255,.018);--input-bg:#181914;
  --manage-bg:rgba(13,14,11,.96);--row-border:#2c2e27;
}
[data-theme="light"]{
  --bg:#f5f4ef;--panel:#ffffff;--panel2:#ece9e0;--line:#d6d2c4;
  --text:linear-gradient(180deg,#628954,#486d3b);--muted:#6e6b5e;--accent:#4a743b;--accent2:#8b5b30;
  --danger:#e62323;--shadow:0 14px 40px rgba(0,0,0,.07);
  --slot-bg:#ffffff;--slot-border:#d4cfbe;--slot-window-border:#dedad0;
  --slot-window-bg:rgba(0,0,0,.02);--input-bg:#f9f8f5;
  --manage-bg:rgba(245,244,239,.97);--row-border:#e6e3d8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:background .2s,color .2s}
body{min-height:100svh;overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.app{
  min-height:100svh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:max(24px,env(safe-area-inset-top)) 0 max(24px,env(safe-area-inset-bottom)) 0;
}
.machine{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(20px,4vh,32px);
}
.top-section{
  width:min(600px,calc(100% - 36px));
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  text-align:center;
}
.brand{
  font-size:clamp(12px,2vw,14px);
  font-weight:800;
  letter-spacing:.22em;
  color:var(--muted);
  text-transform:uppercase;
}
.status{
  min-height:74px;
  text-align:center;
  display:grid;
  justify-items:center;
  align-content:center;
  gap:5px;
}
.status[hidden]{
  display:none !important;
}
.phase{
  font-size:12px;
  font-weight:850;
  letter-spacing:.18em;
  color:var(--accent);
  text-transform:uppercase;
}
.timer{
  font-variant-numeric:tabular-nums;
  font-size:clamp(34px,8vw,54px);
  font-weight:800;
  letter-spacing:-.04em;
}

.slot-wrap{
  width:100%;
  padding:0;
  margin:0;
}
.slot{
  position:relative;
  width:100%;
  min-height:clamp(200px,34vh,320px);
  border-top:1px solid var(--slot-border);
  border-bottom:1px solid var(--slot-border);
  border-left:none;
  border-right:none;
  border-radius:0;
  background:var(--slot-bg);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.035),inset 0 -18px 35px rgba(0,0,0,.25);
  overflow:hidden;
  display:grid;
  place-items:center;
  transition:background .2s,border-color .2s;
}
[data-theme="light"] .slot{
  box-shadow:inset 0 2px 4px rgba(0,0,0,.03),inset 0 -12px 24px rgba(0,0,0,.04);
}
.slot:before,.slot:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  height:clamp(24px,8%,44px);
  z-index:2;
  pointer-events:none;
}
.slot:before{
  top:0;
  background:linear-gradient(var(--slot-bg),transparent);
}
.slot:after{
  bottom:0;
  background:linear-gradient(transparent,var(--slot-bg));
}
.window{
  position:relative;
  width:100%;
  min-height:clamp(160px,26vh,260px);
  display:grid;
  place-items:center;
  border-top:1px solid var(--slot-window-border);
  border-bottom:1px solid var(--slot-window-border);
  background:var(--slot-window-bg);
  transition:border-color .2s;
}
.reel{
  width:100%;
  min-height:100%;
  display:grid;
  place-items:center;
  text-align:center;
  padding:clamp(20px,4vh,36px) clamp(16px,5vw,40px);
  will-change:transform,filter;
}
.topic{
  font-size:clamp(25px,5.5vw,50px);
  line-height:1.2;
  font-weight:850;
  letter-spacing:-.035em;
  overflow-wrap:break-word;
  word-break:break-word;
  white-space:normal;
  max-width:min(960px,94vw);
  margin:0 auto;
}
.reel.spinning .topic{filter:blur(1.8px);opacity:.76}
.reel.winner{animation:winner .65s cubic-bezier(.2,.9,.25,1)}
@keyframes winner{0%{transform:scale(.94);filter:blur(3px);opacity:.5}55%{transform:scale(1.035);filter:blur(0);opacity:1}100%{transform:scale(1)}}

.controls{
  width:min(440px,calc(100% - 36px));
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}
.btn{
  border:1px solid var(--line);
  border-radius:16px;
  color:var(--text);
  background:var(--panel);
  font-weight:850;
  letter-spacing:.12em;
  text-transform:uppercase;
  box-shadow:0 7px 18px rgba(0,0,0,.15);
  transition:transform .12s,background .15s,opacity .15s,border-color .15s;
}
.btn:active{transform:translateY(2px) scale(.985)}
.btn:hover:not(:disabled){background:var(--panel2)}
.btn:disabled{opacity:.35;cursor:not-allowed}

.btn.primary{
  background:linear-gradient(180deg,#77986a,#58744e);
  border-color:#8ba77e;
  color:#11150f;
  box-shadow:0 9px 24px rgba(72,96,59,.25);
}
[data-theme="light"] .btn.primary{
  background:linear-gradient(180deg,#628954,#486d3b);
  border-color:#557c48;
  color:#ffffff;
  box-shadow:0 9px 24px rgba(72,109,59,.25);
}
/* Brighter green on hover — otherwise the generic .btn:hover rule flattens the gradient */
.btn.primary:hover:not(:disabled){
  background:linear-gradient(180deg,#8aab7c,#65885a);
  border-color:#96b288;
}
[data-theme="light"] .btn.primary:hover:not(:disabled){
  background:linear-gradient(180deg,#6d9a58,#547f43);
  border-color:#63944f;
}
.btn.randomise-btn{
  width:100%;
  min-height:56px;
  font-size:16px;
}
.btn.topics-btn{
  width:clamp(130px,42%,180px);
  min-height:42px;
  font-size:13px;
  letter-spacing:.14em;
  border-radius:13px;
}

/* Bottom left theme toggle switch */
.theme-switch-container{
  position:fixed;
  bottom:max(18px,env(safe-area-inset-bottom));
  left:max(18px,env(safe-area-inset-left));
  z-index:25;
}
.theme-switch{
  display:inline-flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  user-select:none;
  background:var(--panel);
  border:1px solid var(--line);
  padding:6px 6px 6px 12px;
  border-radius:24px;
  box-shadow:0 4px 16px rgba(0,0,0,.18);
  transition:background .2s,border-color .2s;
}
.theme-switch input{
  position:absolute;
  opacity:0;
  width:0;
  height:0;
  pointer-events:none;
}
.switch-track{
  position:relative;
  width:46px;
  height:24px;
  background:#3a3d32; /* dark gray track — dark mode (default) */
  border:1px solid #2c2f25;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5px;
  transition:background .2s,border-color .2s;
}
[data-theme="light"] .switch-track{
  background:var(--text); /* keep current light-mode rendering untouched */
  border-color:var(--line);
}
.switch-thumb{
  position:absolute;
  top:2px;
  left:2px;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#ece9e0; /* same thumb colour as light mode — white look in dark mode */
  transition:transform .22s cubic-bezier(.4,0,.2,1);
  box-shadow:0 2px 5px rgba(0,0,0,.25);
}
[data-theme="light"] .switch-thumb{
  background:var(--panel2); /* keep current light-mode rendering untouched */
}
/* Changed '+' to '~' so it matches .switch-track across the intermediate label element */
.theme-switch input:checked ~ .switch-track .switch-thumb{
  transform:translateX(22px);
}
.theme-switch:focus-within{
  outline:2px solid var(--accent);
  outline-offset:2px;
}
.switch-label{
  font-size:11px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
  min-width:38px;
}

/* Topics Modal */
.manage{
  position:fixed;
  inset:0;
  background:var(--manage-bg);
  backdrop-filter:blur(10px);
  z-index:50;
  display:none;
}
.manage.open{display:block}
.manage-inner{
  width:min(760px,100%);
  height:100%;
  margin:auto;
  padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
  display:flex;
  flex-direction:column;
}
.manage-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}
.manage-title{font-size:22px;font-weight:850}
.icon{
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  border-radius:13px;
  width:48px;
  height:48px;
  font-size:21px;
  transition:background .15s;
}
.icon:hover{background:var(--panel2)}
.add-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:9px;
  margin-bottom:20px;
}
.input{
  width:100%;
  min-height:54px;
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--input-bg);
  color:var(--text);
  padding:0 16px;
  transition:background .2s,border-color .2s;
}
.input::placeholder{color:var(--muted)}
.add-btn{min-width:78px}
.list-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--muted);
  font-size:13px;
  margin-bottom:9px;
}
.list{
  flex:1;
  overflow:auto;
  border-top:1px solid var(--line);
  padding-bottom:10px;
}
.row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--row-border);
}
.row input{min-height:48px}
.row-text{overflow-wrap:anywhere;line-height:1.3;padding:7px 2px}
.row-actions{display:flex;gap:7px}
.small{
  width:44px;
  height:44px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  border-radius:12px;
  display:grid;
  place-items:center;
  transition:background .15s,border-color .15s,transform .12s;
}
.small:hover:not(:disabled){background:var(--panel2)}
.small:active{transform:scale(.94)}
.small.delete{
  background:#e62323 !important;
  border-color:#b91c1c !important;
  color:#ffffff !important;
  box-shadow:0 2px 8px rgba(220,38,38,.35);
}
.small.delete:hover:not(:disabled){
  background:#b91c1c !important;
  border-color:#991b1b !important;
}
.small.start{
  background:linear-gradient(180deg,#77986a,#58744e);
  border-color:#8ba77e;
  color:#11150f;
  width:auto;
  min-width:72px;
  padding:0 15px;
  font-size:12px;
  font-weight:850;
  letter-spacing:.1em;
  text-transform:uppercase;
  box-shadow:0 2px 8px rgba(72,96,59,.3);
}
.small.start:hover:not(:disabled){
  background:linear-gradient(180deg,#8aab7c,#65885a);
  border-color:#96b288;
}
.small.start:disabled{opacity:.4;cursor:not-allowed}
[data-theme="light"] .small.start{
  background:linear-gradient(180deg,#628954,#486d3b);
  border-color:#557c48;
  color:#ffffff;
}
[data-theme="light"] .small.start:hover:not(:disabled){
  background:linear-gradient(180deg,#6d9a58,#547f43);
  border-color:#63944f;
}
.empty{color:var(--muted);text-align:center;padding:44px 15px;line-height:1.6}
.footer-actions{display:flex;gap:9px;padding-top:14px}
.footer-actions .btn{flex:1;min-height:48px;font-size:12px}
.file{display:none}

@media(max-width:430px){
  .add-row{grid-template-columns:1fr}
  .add-btn{width:100%}
  .controls{width:calc(100% - 32px)}
  .top-section{width:calc(100% - 32px)}
}
@media(prefers-reduced-motion:reduce){
  .reel.winner{animation:none}
  .btn{transition:none}
  .switch-thumb{transition:none}
}
</style>
</head>
<body>
<main class="app">
  <section class="machine" aria-label="Topic Machine">
    <div class="top-section">
      <div class="brand">Topic Machine</div>

      <div class="status" id="status" hidden>
        <div class="phase" id="phase"></div>
        <div class="timer" id="timer" aria-live="off">02:00</div>
      </div>
    </div>

    <div class="slot-wrap">
      <div class="slot" aria-live="polite" aria-atomic="true">
        <div class="window">
          <div class="reel" id="reel">
            <div class="topic" id="topic">Start the game</div>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn primary randomise-btn" id="randomise">Start</button>
      <button class="btn topics-btn" id="manageBtn" aria-label="Topics">TOPICS</button>
    </div>
  </section>
</main>

<aside class="theme-switch-container" aria-label="Theme toggle">
  <label class="theme-switch" for="themeToggle" title="Toggle light/dark mode">
    <input type="checkbox" id="themeToggle" role="switch" aria-label="Toggle light and dark mode">
    <span class="switch-label" id="themeLabel">Light mode</span>
    <span class="switch-track" aria-hidden="true">
      <span class="switch-thumb"></span>
    </span>
  </label>
</aside>

<section class="manage" id="manage" aria-label="Manage topics" aria-hidden="true">
  <div class="manage-inner">
    <header class="manage-head">
      <div class="manage-title">Topics</div>
      <button class="icon" id="closeManage" aria-label="Close topics">✕</button>
    </header>

    <form class="add-row" id="addForm">
      <input class="input" id="topicInput" autocomplete="off" placeholder="Add a new topic…" aria-label="New topic">
      <button class="btn primary add-btn" type="submit">Add</button>
    </form>

    <div class="list-head">
      <span id="topicCount">0 topics</span>
    </div>
    <div class="list" id="topicList"></div>

    <div class="footer-actions">
      <button class="btn" id="importBtn" type="button">Import JSON</button>
      <button class="btn" id="exportBtn" type="button">Export JSON</button>
      <button class="btn" id="clearBtn" type="button">Clear</button>
    </div>
    <input class="file" id="fileInput" type="file" accept=".json,application/json">
  </div>
</section>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "topic-machine-topics-v1";
  const THEME_KEY = "topic-machine-theme";
  let topics = [];
  let shuffleBag = [];
  let lastWinner = null;

  let timerInterval = null;
  let phaseTimeout = null;
  let sessionToken = 0;
  let spinning = false;
  let audioCtx = null;
  let wakeLock = null;

  const $ = id => document.getElementById(id);
  const reel = $("reel");
  const topicEl = $("topic");
  const status = $("status");
  const phaseEl = $("phase");
  const timerEl = $("timer");
  const randomiseBtn = $("randomise");
  const manage = $("manage");
  const topicInput = $("topicInput");
  const topicList = $("topicList");
  const topicCount = $("topicCount");
  const themeToggle = $("themeToggle");

  function applyTheme(theme) {
    const isLight = theme === "light";
    if (isLight) {
      document.documentElement.setAttribute("data-theme", "light");
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
    if (themeToggle) themeToggle.checked = isLight;
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) metaTheme.setAttribute("content", isLight ? "#f5f4ef" : "#151612");
    try {
      localStorage.setItem(THEME_KEY, theme);
    } catch {}
  }

  function initTheme() {
    let saved = null;
    try {
      saved = localStorage.getItem(THEME_KEY);
    } catch {}
    if (saved === "light" || saved === "dark") {
      applyTheme(saved);
    } else {
      applyTheme("dark");
    }
    if (themeToggle) {
      themeToggle.addEventListener("change", () => {
        applyTheme(themeToggle.checked ? "light" : "dark");
      });
    }
  }

  function loadTopics() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      topics = normaliseTopics(parsed);
    } catch {
      topics = [];
    }
    resetShuffleBag();
    renderTopics();
    renderMain();
  }

  function saveTopics() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(topics));
    } catch {}
  }

  function normaliseTopics(data) {
    const arr = Array.isArray(data) ? data : (data && Array.isArray(data.topics) ? data.topics : null);
    if (!arr) throw new Error("Invalid topic JSON");
    const seen = new Set();
    return arr.map(v => String(v ?? "").trim())
      .filter(v => v && !seen.has(v.toLocaleLowerCase()) && (seen.add(v.toLocaleLowerCase()), true));
  }

  function renderTopics() {
    topicCount.textContent = `${topics.length} topic${topics.length === 1 ? "" : "s"}`;
    topicList.innerHTML = "";
    if (!topics.length) {
      topicList.innerHTML = `<div class="empty">No topics yet.<br>Add something above to get started.</div>`;
      return;
    }
    topics.forEach((text, index) => {
      const row = document.createElement("div");
      row.className = "row";
      row.dataset.index = index;
      row.innerHTML = `
        <div class="row-text">${escapeHTML(text)}</div>
        <div class="row-actions">
          <button class="small start" aria-label="Start ${escapeHTML(text)} now" title="Start this topic now">Start</button>
          <button class="small edit" aria-label="Edit topic">✎</button>
          <button class="small delete" aria-label="Delete topic">🗑</button>
        </div>`;
      topicList.appendChild(row);
    });
  }

  function renderMain() {
    if (!topics.length) {
      topicEl.textContent = "Start the game";
      status.hidden = true;
    } else if (!spinning && !status.hidden) {
      // keep current state
    }
    randomiseBtn.disabled = !topics.length || spinning;
  }

  function escapeHTML(str) {
    return str.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  function resetShuffleBag() {
    shuffleBag = shuffle([...topics]);
    if (shuffleBag.length > 1 && lastWinner !== null && shuffleBag[0] === lastWinner) {
      const swap = 1 + Math.floor(Math.random() * (shuffleBag.length - 1));
      [shuffleBag[0], shuffleBag[swap]] = [shuffleBag[swap], shuffleBag[0]];
    }
  }

  function pickTopic() {
    if (!shuffleBag.length) resetShuffleBag();
    if (!shuffleBag.length) return null;

    const winner = shuffleBag.shift();

    if (!shuffleBag.length && topics.length > 1) {
      shuffleBag = shuffle([...topics]);
      if (shuffleBag[0] === winner) {
        [shuffleBag[0], shuffleBag[1]] = [shuffleBag[1], shuffleBag[0]];
      }
    }
    lastWinner = winner;
    return winner;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function clearTimer() {
    if (timerInterval !== null) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    if (phaseTimeout !== null) {
      clearTimeout(phaseTimeout);
      phaseTimeout = null;
    }
    sessionToken++;
    releaseWakeLock();
  }

  function resetTimerDisplay() {
    clearTimer();
    status.hidden = true;
    phaseEl.textContent = "";
    timerEl.textContent = "02:00";
  }

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60).toString().padStart(2, "0");
    const s = Math.max(0, seconds % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
  }

  async function requestWakeLock() {
    if (!("wakeLock" in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; }, { once: true });
    } catch {}
  }

  async function releaseWakeLock() {
    if (wakeLock) {
      try { await wakeLock.release(); } catch {}
      wakeLock = null;
    }
  }

  function startCountdown(seconds, label, token, onDone) {
    if (token !== sessionToken) return;
    let remaining = seconds;
    phaseEl.textContent = label;
    timerEl.textContent = formatTime(remaining);
    status.hidden = false;
    requestWakeLock();
    beep("transition"); // <-- ADD THIS LINE (Start beep)

    timerInterval = setInterval(() => {
      if (token !== sessionToken) {
        clearInterval(timerInterval);
        timerInterval = null;
        return;
      }
      remaining -= 1;
      timerEl.textContent = formatTime(remaining);
      if (remaining <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        beep("transition"); // <-- ADD THIS LINE (End beep)
        onDone();
      }
    }, 1000);
  }

  function startPracticeTimer(token) {
    if (token !== sessionToken) return;
    startCountdown(120, "Preparation", token, () => {
      if (token !== sessionToken) return;
      // beep("transition"); <-- REMOVE OR COMMENT THIS OUT
      startCountdown(300, "Speaking", token, () => {
        if (token !== sessionToken) return;
        phaseEl.textContent = "Finished";
        timerEl.textContent = "00:00";
        status.hidden = false;
        buzz(3);
        releaseWakeLock();
      });
    });
  }

  function randomise() {
    if (!topics.length || spinning) return;

    clearTimer();
    sessionToken++;
    const token = sessionToken;
    spinning = true;
    randomiseBtn.disabled = true;
    status.hidden = true;
    reel.classList.remove("winner");
    reel.classList.add("spinning");
    startAudio();

    const winner = pickTopic();
    if (winner === null) return;

    spin(winner, token);
  }

  function spin(winner, token) {
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const duration = reduced ? 3000 : 4800;
    const start = performance.now();
    let nextTick = start;
    let lastShown = topicEl.textContent;
    let count = 0;

    const tick = now => {
      if (token !== sessionToken) return;
      const elapsed = now - start;
      const p = Math.min(1, elapsed / duration);

      if (now >= nextTick && p < .94) {
        let candidate = topics[Math.floor(Math.random() * topics.length)];
        if (topics.length > 1 && candidate === lastShown) {
          candidate = topics[(topics.indexOf(candidate) + 1) % topics.length];
        }
        lastShown = candidate;
        topicEl.textContent = candidate;
        count++;
        beep("tick", Math.max(.1, 1 - p));
        buzz(1);

        const interval = 34 + Math.pow(p, 2.65) * 360;
        nextTick = now + interval;
      }

      if (p < 1) {
        requestAnimationFrame(tick);
      } else {
        finishSpin(winner, token);
      }
    };
    requestAnimationFrame(tick);
  }

  function finishSpin(winner, token) {
    if (token !== sessionToken) return;
    topicEl.textContent = winner;
    reel.classList.remove("spinning");
    void reel.offsetWidth;
    reel.classList.add("winner");
    spinning = false;
    randomiseBtn.disabled = false;
    beep("land");
    buzz(4);
    startPracticeTimer(token);
  }

  function startAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch {}
  }

  function beep(type, intensity = 1) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime;

      // 2800Hz–3200Hz is the human ear's most sensitive frequency range
      const freq = type === "land" ? 3200 : 2800;
      osc.type = "sawtooth"; // Biting, sharp waveform rich in harmonics
      osc.frequency.setValueAtTime(freq, now);

      // Instant attack to 0.5 volume (significantly louder than 0.018)
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(0.5, now + 0.002);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    } catch {}
  }

  function buzz(pattern) {
    if (!navigator.vibrate) return;
    if (pattern === 1) navigator.vibrate(6);
    else if (pattern === 2) navigator.vibrate(18);
    else if (pattern === 3) navigator.vibrate([20,40,20]);
    else navigator.vibrate([18,30,45,30,70]);
  }

  function openManage() {
    manage.classList.add("open");
    manage.setAttribute("aria-hidden", "false");
    renderTopics();
    setTimeout(() => topicInput.focus(), 30);
  }

  function closeManage() {
    manage.classList.remove("open");
    manage.setAttribute("aria-hidden", "true");
  }

  function addTopic() {
    const value = topicInput.value.trim();
    if (!value) return;
    const exists = topics.some(t => t.toLocaleLowerCase() === value.toLocaleLowerCase());
    if (!exists) {
      topics.push(value);
      saveTopics();
      resetShuffleBag();
      renderTopics();
      renderMain();
    }
    topicInput.value = "";
    topicInput.focus();
  }

  function editTopic(index, row) {
    const old = topics[index];
    const input = document.createElement("input");
    input.className = "input";
    input.value = old;
    input.setAttribute("aria-label", "Edit topic");
    row.querySelector(".row-text").replaceWith(input);
    input.focus();
    input.select();

    const finish = save => {
      if (!row.isConnected) return;
      if (save) {
        const value = input.value.trim();
        const duplicate = topics.some((t,i) => i !== index && t.toLocaleLowerCase() === value.toLocaleLowerCase());
        if (value && !duplicate) topics[index] = value;
      }
      saveTopics();
      resetShuffleBag();
      renderTopics();
      renderMain();
    };

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      if (e.key === "Escape") { e.preventDefault(); finish(false); }
    });
    input.addEventListener("blur", () => finish(true), { once: true });
  }

  function deleteTopic(index) {
    if (!confirm(`Delete "${topics[index]}"?`)) return;
    topics.splice(index, 1);
    saveTopics();
    resetShuffleBag();
    renderTopics();
    renderMain();
  }

  // Start a chosen topic immediately, skipping the randomiser/spin.
  function startTopicDirect(index) {
    const text = topics[index];
    if (!text) return;

    // Abort any running timer or mid-flight spin and start fresh
    clearTimer();
    sessionToken++;
    const token = sessionToken;
    spinning = false;
    randomiseBtn.disabled = false;

    // Show the chosen topic right away with a quick "winner" pop (no reel spin)
    reel.classList.remove("spinning", "winner");
    topicEl.textContent = text;
    void reel.offsetWidth;
    reel.classList.add("winner");

    // Treat it as "just picked" so the next main-screen Start can't immediately land on it again
    lastWinner = text;
    const bagIndex = shuffleBag.indexOf(text);
    if (bagIndex !== -1) shuffleBag.splice(bagIndex, 1);

    closeManage();
    startAudio();
    beep("land");
    buzz(4);
    startPracticeTimer(token);
  }

  function clearTopics() {
    if (!topics.length) return;
    if (!confirm("Clear all topics?")) return;
    topics = [];
    shuffleBag = [];
    lastWinner = null;
    saveTopics();
    renderTopics();
    renderMain();
  }

  function exportJSON() {
    const blob = new Blob([JSON.stringify({ topics }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "topics.json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 500);
  }

  function importJSON() {
    $("fileInput").click();
  }

  async function handleImport(file) {
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const imported = normaliseTopics(parsed);
      if (!confirm(`Replace your current topics with ${imported.length} imported topic${imported.length === 1 ? "" : "s"}?`)) return;
      clearTimer();
      spinning = false;
      topics = imported;
      shuffleBag = [];
      lastWinner = null;
      saveTopics();
      resetShuffleBag();
      renderTopics();
      renderMain();
    } catch {
      alert("That JSON file is not valid. Use {\"topics\":[...]} or a plain JSON array.");
    } finally {
      $("fileInput").value = "";
    }
  }

  $("addForm").addEventListener("submit", e => { e.preventDefault(); addTopic(); });
  $("manageBtn").addEventListener("click", openManage);
  $("closeManage").addEventListener("click", closeManage);
  $("randomise").addEventListener("click", randomise);
  $("importBtn").addEventListener("click", importJSON);
  $("exportBtn").addEventListener("click", exportJSON);
  $("clearBtn").addEventListener("click", clearTopics);
  $("fileInput").addEventListener("change", e => handleImport(e.target.files[0]));

  topicList.addEventListener("click", e => {
    const row = e.target.closest(".row");
    if (!row) return;
    const index = Number(row.dataset.index);
    if (e.target.closest(".start")) startTopicDirect(index);
    if (e.target.closest(".edit")) editTopic(index, row);
    if (e.target.closest(".delete")) deleteTopic(index);
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && manage.classList.contains("open")) closeManage();
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !status.hidden && phaseEl.textContent !== "Finished" && phaseEl.textContent !== "Stopped") {
      requestWakeLock();
    }
  });

  initTheme();
  loadTopics();
})();
</script>
</body>
</html>
